<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kapcsolat – Fehér József</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="kapcsolat-oldal">
    <header>
      <div class="container nav">
        <a class="brand" href="index.html">Fehér József</a>
        <button id="menu-toggle" type="button" class="menu-toggle"
                aria-expanded="false" aria-controls="mainmenu" aria-label="Menü">☰</button>
        <nav class="menu" id="mainmenu">
          <a href="index.html">Főoldal</a>
          <a href="rolam.html">Rólam</a>
          <a href="gyik.html">GYIK</a>
          <a href="kapcsolat.html">Kapcsolat</a>
        </nav>
        <a class="cta" href="kapcsolat.html">Időpontkérés</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container pad">
          <div class="contact-layout">
            <div>
              <h1>Kapcsolat</h1>
              <p>
                Elérhetőség: <strong>feherj@grantis.hu</strong> •
                <strong>+36 30 634 0195</strong>
              </p>

              <form class="mt-16 contact-form-grid" action="https://formspree.io/f/mzzkygya" method="POST">
                <div>
                  <label>Név*</label>
                  <input required name="name" />
                </div>

                <div>
                  <label>E-mail*</label>
                  <input required type="email" name="email" />
                </div>

                <div>
                  <label>Telefonszám*</label>
                  <input name="phone" type="tel" inputmode="numeric" autocomplete="tel"
                         required maxlength="15" pattern="^[0-9]{9,15}$"
                         title="Kérlek, csak számokat adj meg (9–15 számjegy)."
                         oninput="this.value=this.value.replace(/[^0-9]/g,'');" />
                </div>

                <div>
                  <label>Irányítószám*</label>
                  <input name="zip" inputmode="numeric" autocomplete="postal-code"
                         required maxlength="4" pattern="^[0-9]{4}$"
                         title="Kérlek, 4 számjegyű irányítószámot adj meg."
                         oninput="this.value=this.value.replace(/[^0-9]/g,'');" />
                </div>

                <div class="full">
                  <label for="reason">Miért jelentkezik?*</label>
                  <select id="reason" name="reason" required>
                    <option value="" selected disabled>Válassz egy opciót…</option>
                    <option value="idopont">Időpont egyeztetés</option>
                    <option value="megtakaritas">Megtakarítás / befektetés</option>
                    <option value="hitel">Hitel / hitelkiváltás</option>
                    <option value="biztositas">Biztosítás / életbiztosítás</option>
                    <option value="nyugdij">Nyugdíj / nyugdíjcél</option>
                    <option value="vallalkozas">Vállalkozás pénzügyei</option>
                    <option value="other">Egyéb – saját megfogalmazás</option>
                  </select>
                </div>

                <div class="full" id="other-wrap" style="display:none;">
                  <label for="other_text">Írd le röviden, miben segíthetek*</label>
                  <textarea id="other_text" name="other_text" rows="4"></textarea>
                </div>

                <div class="full" id="note-wrap">
                  <label for="note">Megjegyzés (opcionális)</label>
                  <textarea id="note" name="note" rows="4"></textarea>
                </div>

                <label class="consent full">
                  <input type="checkbox" required name="gdpr" />
                  <span>
                    Elolvastam és elfogadom az
                    <a href="adatkezeles.html" target="_blank" rel="noopener">Adatkezelési tájékoztatót</a>,
                    és hozzájárulok, hogy a megadott személyes adataimat Fehér József a kapcsolatfelvétel és időpont-egyeztetés céljából kezelje.
                  </span>
                </label>

                <input type="hidden" name="_subject" value="Új kapcsolatfelvétel" />
                <input type="hidden" name="_redirect" value="/koszonjuk.html" />
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

                <button class="submit full" type="submit">Beküldés</button>
                <p class="tiny full" aria-live="polite"></p>
              </form>
            </div>

            <aside class="contact-right" aria-hidden="true">
              <img src="feher-jozsef-fejlec-1.jpg" alt="" loading="lazy" />
            </aside>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <strong class="footer-brand">Fehér József</strong>
        <div class="footer-links">
          <span>© <span id="year"></span> Fehér József</span>
          <span class="dot">•</span>
          <a href="adatkezeles.html">Adatkezelési tájékoztató</a>
          <span class="dot">•</span>
          <a href="joginyilatkozat.html">Jogi nyilatkozat</a>
        </div>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
